# ci-build — this file is yours.
#
# gt created it once and will never modify or delete it again. It is called by
# ci-orchestration.yml and must keep `workflow_call`.
#
name: ci-build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck

      - name: Lint all shell scripts
        run: |
          set -euo pipefail
          # -x follows `source` directives so library functions resolve.
          shellcheck -x -S style lib/*.sh services/*/*.sh
