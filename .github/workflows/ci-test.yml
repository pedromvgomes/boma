#
# The bats unit suite, moved from ci.yml verbatim.
name: ci-test

on:
  workflow_call:

permissions:
  contents: read

jobs:
  unit:
    name: bats unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install bats
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bats

      - name: Run unit tests
        run: bats lib/test/
