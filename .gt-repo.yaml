# Repository governance for gt. This file is the source of truth; run
# 'gt repo sync' to render it, and 'gt repo check' to verify.
#
# Shared policy (Dependabot cooldown, commit-message prefixes, the weekly sync
# schedule) lives in gt's templates, not here, so it stays consistent across
# every governed repo.
#
# The pipeline stages below become jobs in ci-orchestration.yml, each calling a
# ci-*/cd-* workflow that belongs to this repository: gt creates those once and
# never touches them again. Branch protection needs exactly one check, ci-gate,
# which waits on all of them.

gt_version: v1.0.0
dependabot:
  - ecosystem: docker
    directory: /services/vaultwarden/test
    note: |
      The Debian base image of the end-to-end test container. This only works
      because the file is named `Dockerfile` — Dependabot's docker ecosystem
      does not discover a file named `Containerfile`.
  - ecosystem: github-actions
    directory: /
  - ecosystem: pip
    directory: /
    note: |
      pytest and friends, pinned via pyproject.toml / uv.lock.

      There is deliberately no gitsubmodule entry anywhere in this file: the
      bats helper libraries were not vendored as submodules, so the unit tests
      use plain bats-core with no third-party assertion helpers.
dependabot_auto_merge:
  enabled: true
  schedule: 0 1 * * *
  max_bump: minor
  delete_branch: true
bulwark:
  # On. There is no security scanning here today, so gt's stage is an addition
  # rather than a duplicate. Expect findings on the first run; nothing gates on
  # them while ci-gate is not the required check.
  enabled: true
pipeline:
  ci:
    enabled: true
    stages:
      - preflight
      - build
      - test
      - end2end
    merge_queue: false
  # Off. There is no tag-triggered release workflow here — build-vaultwarden.yml
  # runs on a schedule — but cd-orchestration would claim `v*.*.*` with
  # verify-attestation require: true, so the first tag pushed would go red on a
  # pipeline that ships nothing.
  cd:
    enabled: false
    stages:
      - preflight
      - publish
      - deploy
      - verify
    tags:
      - v*.*.*
conventional_commits:
  enabled: true
  scope: pr_title
  types:
    - feat
    - fix
    - docs
    - style
    - refactor
    - perf
    - test
    - build
    - ci
    - chore
    - revert
settings:
  merge:
    squash: true
    merge_commit: false
    rebase: false
    delete_branch_on_merge: true
  branch_protection:
    branch: main
    required_approvals: 0
    require_up_to_date: false
files:
  - sync
  - dependabot-auto-merge
